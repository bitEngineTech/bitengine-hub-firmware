# 版本一律钉死：manifest 用 '*'/'^x.y' 时，任何一次 fullclean 都会把
# managed_components 重新解析到当时的最新版（v0.5.0-22→23 就撞上过：
# mdns/mqtt/ethernet_init/dm9051/w5500 五个组件被静默升级）。
# 升级组件请显式改这里的版本号并重新验证，不要依赖范围解析。
dependencies:
  espressif/mdns: '==1.11.0'
  espressif/w5500: '==1.0.1'
  espressif/ethernet_init: '==1.3.0'
  # ethernet_init 只声明 dm9051 ^1.0.0，会浮动到最新；本板实际用的就是 DM9051，
  # 这里显式钉死，同时让它在依赖表里可见。
  espressif/dm9051: '==1.1.0'
