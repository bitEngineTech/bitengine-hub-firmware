<div id="app">
    <div class="text-center" style="padding:40px;color:#888">Loading...</div>
</div>
<!-- This list must stay in sync with the inline list in build.sh. This file is
     only used when opening the sources directly during development, so a
     missing entry costs you a feature in the dev environment while the built
     artifact stays fine — which makes it very hard to notice.
     (tz.js and pages/logs.js were missing here for a while: "Detect" timezone
     on the settings page threw a ReferenceError, and the Logs nav item did
     nothing at all.)
     i18n.js must load before anything that calls t(); the language tables
     register themselves into it. -->
<script src="js/i18n.js"></script>
<script src="js/i18n/de.js"></script>
<script src="js/i18n/zh.js"></script>
<script src="js/api.js"></script>
<script src="js/tz.js"></script>
<script src="js/ws.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/login.js"></script>
<script src="js/pages/setup.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/wifi.js"></script>

<script src="js/pages/zigbee.js"></script>
<script src="js/pages/thread.js"></script>
<script src="js/pages/spectrum.js"></script>
<script src="js/pages/led.js"></script>
<script src="js/pages/mqtt_webhook.js"></script>
<script src="js/pages/ota.js"></script>
<script src="js/pages/logs.js"></script>
<script src="js/pages/settings.js"></script>
</body>
</html>
